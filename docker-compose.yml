services:
  postgres:
    image: postgres:16-alpine
    container_name: cleancity-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cleancity
      POSTGRES_PASSWORD: cleancity_dev
      POSTGRES_DB: cleancity
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
